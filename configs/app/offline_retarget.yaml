# @package _global_
defaults:
  - /retargeting_profiles: vector_wrist_joint_panda_leap_paxini
  - /inputs: avp
  - /teleoperation_modes: simulation
  - /solvers: nlopt_slsqp
  # Reuse the standalone apps' defaults for post-processing actions.
  - /app/benchmark@post.benchmark
  - /app/replay@post.visualize
  - _self_

app:
  id: offline_retarget

data: tests/fixtures/avp_teleop_2025-01-16_20-27-43.npz
start: 0
end: -1
stride: 1
output_root: outputs
output_dir: null
run_name: null

post:
  benchmark:
    enabled: false
    # The post action must follow this offline run when output_root is overridden.
    output_root: ${output_root}
    plot_root: ${output_root}
  visualize:
    enabled: false
