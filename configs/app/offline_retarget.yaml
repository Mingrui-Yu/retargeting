# @package _global_
defaults:
  - /retargeting_profiles: vector_wrist_joint_panda_leap_paxini
  - /detection_sources: avp
  - /teleoperation_modes: simulation
  - /solvers: nlopt_slsqp
  - _self_

app:
  id: offline_retarget

data: tests/fixtures/avp_teleop_2025-01-16_20-27-43.npz
start: 0
end: -1
stride: 1
output_root: outputs
output_dir: null
run_name: null

post:
  benchmark:
    enabled: false
    output_root: ${output_root}
    output_dir: null
    plot: true
    plot_root: ${output_root}
    plot_dir: null
  visualize:
    enabled: false
    viewer:
      fps: 20.0
      port: 9218
      no_robot_mesh: false
      trail_length: 120
      human_keypoint_size: 0.018
