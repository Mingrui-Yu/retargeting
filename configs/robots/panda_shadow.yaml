  - ee_link
  - thtip
  - fftip
  - mftip
  - rftip
  - lftip
  - thdistal
  - ffdistal
  - mfdistal
  - rfdistal
  - lfdistal
wrist_frame_name: ee_link
human_hand_scale: 1.0
benchmark:
  wrist_link_name: ee_link
  # Benchmark mappings bind each robot fingertip frame to the corresponding
  # MANO fingertip keypoint and direction segment.
  fingertips:
    - link_name: thtip
      human_tip_index: 4
      human_direction_base_index: 3
      robot_direction_axis: z
      is_thumb: true
    - link_name: fftip
      human_tip_index: 8
      human_direction_base_index: 7
      robot_direction_axis: z
    - link_name: mftip
