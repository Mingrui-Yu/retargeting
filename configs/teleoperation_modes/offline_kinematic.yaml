# @package _global_
defaults:
  - /inputs: avp
  - /backends: kinematic
  - _self_

teleoperation_mode:
  name: offline_kinematic
  robot_control:
    use_hardware: false
    use_virtual_hardware: false
    use_high_freq_interp: false
  output:
    smooth_output_qpos: false
    smoothing_alpha: 0.3
  pipeline:
    realtime: false
    startup_move_frames: 0
    ctrlrange_policy: clip
    use_relative_wrist_alignment: true
    missing_frame_policy: hold

input:
  mode: offline
  data: tests/fixtures/avp_teleop_2025-01-16_20-27-43.npz
  source_hz: 20.0
  start: 0
  end: -1
  loop: false
